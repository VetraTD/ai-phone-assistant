<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons, made from the VetraTD logo. favicon.ico holds 16, 32 and 48px
         for tabs and the bookmarks bar; the 180px icon is for iPhone and iPad;
         the manifest's 192 and 512px icons are for Android and Chrome. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VetraTD | AI Receptionist</title>
    <meta
      name="description"
      content="VetraTD is an AI receptionist that answers the calls your business can't. It books appointments, takes messages and qualifies leads, day and night."
    />
    <link rel="canonical" href="https://vetratd.com/" />
    <meta name="theme-color" content="#010b29" />

    <!-- Link previews (LinkedIn, WhatsApp, Facebook, iMessage, Slack). These
         apps read this file without running JavaScript, so every page on the
         site previews with these values. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VetraTD" />
    <meta property="og:title" content="VetraTD | AI Receptionist" />
    <meta
      property="og:description"
      content="VetraTD is an AI receptionist that answers the calls your business can't. It books appointments, takes messages and qualifies leads, day and night."
    />
    <meta property="og:url" content="https://vetratd.com/" />
    <meta property="og:image" content="https://vetratd.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VetraTD. Every call. Answered. The AI receptionist for businesses that run on appointments." />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VetraTD | AI Receptionist" />
    <meta
      name="twitter:description"
      content="VetraTD is an AI receptionist that answers the calls your business can't. It books appointments, takes messages and qualifies leads, day and night."
    />
    <meta name="twitter:image" content="https://vetratd.com/og-image.png" />
    <meta name="twitter:image:alt" content="VetraTD. Every call. Answered. The AI receptionist for businesses that run on appointments." />

    <!-- Fonts are SELF-HOSTED (src/fonts.css, public/fonts). The Google Fonts
         <link> that used to sit here handed Google the IP address of every
         clinic staffer who opened the dashboard, with no processor agreement
         covering it. See src/fonts.css for the reasoning and
         scripts/fetch-fonts.sh to regenerate. -->
  </head>
  <body>
    <noscript>
      <p>
        <a href="https://vetratd.com/legal">Privacy Policy</a>
        ·
        <a href="https://vetratd.com/">Home</a>
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
