<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- This file is shared by both builds (vetratd.com and app.vetratd.com), so
         the tags here stay neutral. Each public page sets its own title,
         description and canonical URL from src/site/usePageMeta.js. -->
    <title>Vetra</title>
    <meta
      name="description"
      content="Vetra answers your business's phone calls, books appointments in your own diary, takes messages and writes down every call. Set up with you by hand."
    />
    <meta name="theme-color" content="#3a8ff2" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vetra" />
    <meta property="og:title" content="Vetra, the receptionist that answers your phone and keeps your diary" />
    <meta
      property="og:description"
      content="Answers every call in your name, books into your own appointment book, takes messages and writes down what was said. Set up with you, live in 3 business days."
    />
    <meta property="og:url" content="https://vetratd.com/" />
    <meta property="og:image" content="https://vetratd.com/vetra-logo.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vetra, the receptionist that answers your phone and keeps your diary" />
    <meta
      name="twitter:description"
      content="Answers every call in your name, books into your own appointment book, takes messages and writes down what was said. Set up with you, live in 3 business days."
    />
    <meta name="twitter:image" content="https://vetratd.com/vetra-logo.png" />

    <!-- Fonts are SELF-HOSTED (src/fonts.css, public/fonts). The Google Fonts
         <link> that used to sit here handed Google the IP address of every
         clinic staffer who opened the dashboard, with no processor agreement
         covering it. See src/fonts.css for the reasoning and
         scripts/fetch-fonts.sh to regenerate. -->
  </head>
  <body>
    <noscript>
      <p>
        <a href="https://vetratd.com/privacy">Privacy Policy</a>
        <a href="https://vetratd.com/">Home</a>
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
